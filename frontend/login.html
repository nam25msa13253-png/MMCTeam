<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MMC 24H</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(25px); }
        .shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 relative overflow-hidden">

    <!-- Decoration -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-500/10 rounded-full blur-[120px]"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-500/10 rounded-full blur-[120px]"></div>

    <div id="login-card" class="max-w-md w-full glass rounded-[3.5rem] shadow-2xl border border-white relative z-10">
        <div class="p-8 sm:p-14">
            <div class="text-center mb-12">
                <a href="/" class="inline-flex items-center gap-2.5 mb-8 group">
                    <div class="bg-blue-600 p-2.5 rounded-2xl shadow-xl shadow-blue-200 transition-transform group-hover:scale-110">
                        <i data-lucide="waves" class="text-white w-6 h-6"></i>
                    </div>
                    <span class="text-2xl font-black text-slate-900">MMC 24H</span>
                </a>
                <h1 class="text-3xl font-black text-slate-900 mb-2 tracking-tight">Mừng bạn trở lại</h1>
                <p class="text-slate-500 font-medium">Cùng MMC làm sạch thế giới của bạn</p>
            </div>

            <form id="login-form" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em] ml-1">Email hoặc Username</label>
                    <div class="relative group">
                        <i data-lucide="user" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5 group-focus-within:text-blue-600 transition"></i>
                        <input type="text" id="identifier" required
                            class="w-full pl-14 pr-5 py-4.5 bg-white border border-slate-200 rounded-[1.5rem] outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-600 transition-all font-medium"
                            placeholder="tuan.mmc@gmail.com">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em] ml-1">Mật khẩu</label>
                    <div class="relative group">
                        <i data-lucide="lock" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 w-5 h-5 group-focus-within:text-blue-600 transition"></i>
                        <input type="password" id="password" required
                            class="w-full pl-14 pr-5 py-4.5 bg-white border border-slate-200 rounded-[1.5rem] outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-600 transition-all"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs font-bold">
                    <label class="flex items-center gap-2 cursor-pointer text-slate-400 hover:text-blue-600 transition">
                        <input type="checkbox" class="w-4 h-4 rounded accent-blue-600">
                        Ghi nhớ tôi
                    </label>
                    <a href="#" class="text-blue-600 hover:underline">Quên mật khẩu?</a>
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-black text-lg shadow-2xl hover:bg-blue-600 transition-all active:scale-95 flex items-center justify-center gap-3">
                    Đăng Nhập <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </form>

            <div id="message" class="mt-8 text-center text-sm font-bold hidden px-4 py-3 rounded-2xl bg-red-50 text-red-600 border border-red-100"></div>

            <p class="mt-12 text-center text-slate-400 font-bold text-xs uppercase tracking-widest">
                Chưa có tài khoản? 
                <a href="/dang-ky.html" class="text-blue-600 hover:underline">Đăng ký ngay</a>
            </p>
        </div>
    </div>

    <!-- Lock UI Overlay -->
    <div id="lock-overlay" class="fixed inset-0 bg-slate-900/90 backdrop-blur-xl z-[100] hidden flex flex-col items-center justify-center text-white p-6">
        <div class="bg-red-600 p-6 rounded-[2.5rem] mb-8 animate-bounce">
            <i data-lucide="shield-alert" class="w-12 h-12"></i>
        </div>
        <h2 class="text-3xl font-black mb-4">Tài khoản bị tạm khóa!</h2>
        <p class="text-slate-400 text-center max-w-sm mb-8">Bạn đã nhập sai mật khẩu quá 5 lần. Để bảo mật, vui lòng quay lại sau <span id="lock-timer" class="text-white font-black">15:00</span>.</p>
        <button onclick="location.reload()" class="bg-white text-slate-900 px-8 py-3 rounded-full font-bold">Thử lại</button>
    </div>

    <script>
        lucide.createIcons();
        const API_BASE = 'http://127.0.0.1:3000/api';
        
        let loginAttempts = 0;
        const form = document.getElementById('login-form');
        const messageDiv = document.getElementById('message');
        const card = document.getElementById('login-card');
        const lockOverlay = document.getElementById('lock-overlay');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageDiv.classList.add('hidden');

            const identifier = document.getElementById('identifier').value;
            const password = document.getElementById('password').value;

            try {
                // Giả lập logic kiểm tra bảo mật (Note CTuấn)
                // Thông báo mập mờ để tránh lộ thông tin account tồn tại
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: identifier, mat_khau: password })
                });

                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('mmc_token', result.token);
                    window.location.href = '/';
                } else {
                    throw new Error("Thông tin đăng nhập không chính xác.");
                }

            } catch (error) {
                loginAttempts++;
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 500);

                messageDiv.textContent = error.message;
                messageDiv.classList.remove('hidden');

                if (loginAttempts >= 5) {
                    showLockUI();
                }
            }
        });

        function showLockUI() {
            lockOverlay.classList.remove('hidden');
            let timeLeft = 900; // 15 phút
            const itv = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                document.getElementById('lock-timer').textContent = `${m}:${s.toString().padStart(2, '0')}`;
                if (timeLeft <= 0) clearInterval(itv);
            }, 1000);
        }
    </script>
</body>
</html>
