<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử đơn hàng - MMC 24H</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --secondary: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
        }

        /* --- SIDEBAR NAVIGATION --- */
        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid var(--border);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            margin-bottom: 2.5rem;
            padding-left: 0.5rem;
        }

        .logo-icon {
            background: var(--primary);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .nav-menu { list-style: none; flex-grow: 1; }
        .nav-item { margin-bottom: 0.5rem; }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 1rem;
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .nav-link:hover { background: var(--primary-light); color: var(--primary); }
        .nav-link.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .nav-link i { width: 20px; font-size: 1.1rem; }

        .logout-btn { color: var(--danger) !important; margin-top: auto; border-top: 1px solid var(--border); padding-top: 1rem; }
        .logout-btn:hover { background: #fef2f2; }

        /* --- MAIN CONTENT --- */
        .main-content {
            margin-left: 280px;
            flex-grow: 1;
            padding: 2rem 5%;
            width: calc(100% - 280px);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* --- FILTERS --- */
        .filter-section {
            background: white;
            padding: 1.25rem;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: white;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* --- ORDERS TABLE --- */
        .orders-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .table-responsive { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th {
            background: #f8fafc;
            padding: 1rem 1.5rem;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.025em;
        }

        td { padding: 1.25rem 1.5rem; border-top: 1px solid var(--border); font-size: 0.95rem; vertical-align: middle; }

        .order-id { font-weight: 700; color: var(--primary); }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Status Colors mapping with database.sql ENUMs */
        .status-hoan_thanh { background: #dcfce7; color: #166534; }
        .status-da_huy { background: #fee2e2; color: #991b1b; }
        .status-dang_giat, .status-dang_phoi_say, .status-dang_giao_tra { background: #eff6ff; color: #1e40af; }
        .status-cho_xac_nhan, .status-da_xac_nhan { background: #fef3c7; color: #92400e; }

        .btn-action {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: white;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-action:hover { background: var(--bg-body); color: var(--primary); }

        .btn-dispute {
            color: var(--danger);
            border-color: #fee2e2;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid;
        }
        .btn-dispute:hover { background: var(--danger); color: white; }

        /* --- EMPTY STATE --- */
        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }

        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 992px) {
            .sidebar { width: 80px; padding: 2rem 0.5rem; }
            .sidebar .logo span, .sidebar .nav-link span { display: none; }
            .sidebar .nav-link { justify-content: center; padding: 12px; }
            .main-content { margin-left: 80px; width: calc(100% - 80px); }
        }

        @media (max-width: 768px) {
            .page-header h2 { font-size: 1.25rem; }
            td, th { padding: 1rem; }
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <a href="customer_dashboard.html" class="logo">
            <div class="logo-icon"><i class="fas fa-water"></i></div>
            <span>MMC 24H</span>
        </a>

        <ul class="nav-menu">
            <li class="nav-item">
                <a href="customer_dashboard.html" class="nav-link">
                    <i class="fas fa-th-large"></i> <span>Tổng quan</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="search_hosts_auth.html" class="nav-link">
                    <i class="fas fa-search"></i> <span>Tìm điểm giặt</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="order_history.html" class="nav-link active">
                    <i class="fas fa-history"></i> <span>Lịch sử đơn hàng</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">
                    <i class="fas fa-wallet"></i> <span>Ví của tôi</span>
                </a>
            </li>
            <li class="nav-item" style="margin-top: 2rem;">
                <a href="#" class="nav-link logout-btn" id="btnLogout">
                    <i class="fas fa-sign-out-alt"></i> <span>Đăng xuất</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header">
            <div>
                <h2>Lịch sử đơn hàng</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Dữ liệu đơn hàng từ Database MMC</p>
            </div>
            <div class="user-profile" id="userHeader">
                <span id="displayUserName" style="font-weight: 600; font-size: 0.9rem;">Đang tải...</span>
                <div class="user-avatar" id="displayAvatar">?</div>
            </div>
        </header>

        <!-- Filter Bar -->
        <section class="filter-section">
            <button class="filter-btn active" data-status="all">Tất cả</button>
            <button class="filter-btn" data-status="processing">Đang xử lý</button>
            <button class="filter-btn" data-status="hoan_thanh">Đã hoàn thành</button>
            <button class="filter-btn" data-status="da_huy">Đã hủy</button>
        </section>

        <!-- Orders Table -->
        <div class="orders-card">
            <div class="table-responsive">
                <table id="ordersTable">
                    <thead>
                        <tr>
                            <th>Mã đơn</th>
                            <th>Ngày đặt</th>
                            <th>Điểm giặt</th>
                            <th class="hide-mobile">Khối lượng</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody">
                        <tr id="loadingRow">
                            <td colspan="7" style="text-align: center; padding: 3rem;">
                                <i class="fas fa-circle-notch fa-spin fa-2x" style="color: var(--primary);"></i>
                                <p style="margin-top: 1rem;">Đang kết nối Database...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Cấu hình kết nối Backend
        const API_BASE_URL = "http://localhost:3000/api";
        let allOrders = [];

        // Ánh xạ trạng thái Database sang Tiếng Việt
        const statusMap = {
            'cho_xac_nhan': 'Chờ xác nhận',
            'da_xac_nhan': 'Đã xác nhận',
            'dang_lay_do': 'Đang lấy đồ',
            'dang_giat': 'Đang giặt',
            'dang_phoi_say': 'Đang phơi/sấy',
            'da_giat_xong': 'Đã giặt xong',
            'dang_giao_tra': 'Đang giao trả',
            'hoan_thanh': 'Hoàn thành',
            'da_huy': 'Đã hủy'
        };

        const formatVND = (amount) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);

        // --- HÀM LẤY DỮ LIỆU THỰC TẾ TỪ DATABASE ---
        async function fetchOrdersFromDB() {
            const token = localStorage.getItem('mmc_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                // Gọi API lấy đơn hàng (orderController.getMyOrders)
                const response = await fetch(`${API_BASE_URL}/orders/my-orders`, {
                    headers: { 
                        'Authorization': token, // Bearer token đã lưu khi login
                        'Content-Type': 'application/json'
                    }
                });

                const result = await response.json();
                
                if (result.success) {
                    allOrders = result.data;
                    renderOrders(allOrders);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error("Lỗi kết nối API:", error);
                document.getElementById('ordersBody').innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align:center; padding: 2rem; color: var(--danger);">
                            <i class="fas fa-exclamation-triangle fa-2x"></i>
                            <p style="margin-top: 1rem;">Không thể lấy dữ liệu từ máy chủ. Vui lòng thử lại sau.</p>
                        </td>
                    </tr>
                `;
            }
        }

        function renderOrders(orders) {
            const body = document.getElementById('ordersBody');
            body.innerHTML = '';

            if (orders.length === 0) {
                body.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-state">
                                <i class="fas fa-folder-open"></i>
                                <p>Bạn chưa có đơn hàng nào trong hệ thống.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            orders.forEach(order => {
                const statusKey = order.trang_thai_don_hang;
                const date = new Date(order.ngay_tao_don).toLocaleString('vi-VN');

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="order-id">#MMC-${String(order.ma_don_hang).padStart(4, '0')}</span></td>
                    <td style="font-size: 0.85rem;">${date}</td>
                    <td class="host-name">Host ID: ${order.ma_chu_nha}</td>
                    <td class="hide-mobile">${order.khoi_luong_kg} kg</td>
                    <td style="font-weight: 600;">${formatVND(order.tong_tien_khach_tra)}</td>
                    <td>
                        <span class="status-badge status-${statusKey}">
                            <i class="fas ${getStatusIcon(statusKey)}"></i> ${statusMap[statusKey] || statusKey}
                        </span>
                    </td>
                    <td>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn-action" title="Xem chi tiết" onclick="viewDetail(${order.ma_don_hang})"><i class="fas fa-eye"></i></button>
                            ${statusKey === 'hoan_thanh' ? `<button class="btn-dispute" onclick="openComplaint(${order.ma_don_hang})">Khiếu nại</button>` : ''}
                        </div>
                    </td>
                `;
                body.appendChild(row);
            });
        }

        function getStatusIcon(status) {
            if (status === 'hoan_thanh') return 'fa-check-circle';
            if (status === 'da_huy') return 'fa-times-circle';
            if (['dang_giat', 'dang_phoi_say'].includes(status)) return 'fa-sync-alt fa-spin';
            return 'fa-clock';
        }

        // Logic lọc dữ liệu
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelector('.filter-btn.active').classList.remove('active');
                this.classList.add('active');
                
                const status = this.dataset.status;
                if (status === 'all') {
                    renderOrders(allOrders);
                } else if (status === 'processing') {
                    const processingList = ['cho_xac_nhan', 'da_xac_nhan', 'dang_lay_do', 'dang_giat', 'dang_phoi_say', 'da_giat_xong', 'dang_giao_tra'];
                    renderOrders(allOrders.filter(o => processingList.includes(o.trang_thai_don_hang)));
                } else {
                    renderOrders(allOrders.filter(o => o.trang_thai_don_hang === status));
                }
            };
        });

        function viewDetail(id) {
            alert(`Xem chi tiết đơn hàng #${id}`);
        }

        function openComplaint(id) {
            alert(`Đang mở yêu cầu khiếu nại cho đơn #${id}. Dữ liệu sẽ được gửi tới disputeController.js`);
        }

        // Tải thông tin người dùng từ LocalStorage
        window.onload = () => {
            const user = JSON.parse(localStorage.getItem('mmc_user')) || { name: "Nguyễn Công Tuấn" };
            document.getElementById('displayUserName').innerText = user.name || user.ho_ten;
            document.getElementById('displayAvatar').innerText = (user.name || user.ho_ten || "U").charAt(0);
            
            fetchOrdersFromDB();
        };

        // Đăng xuất
        document.getElementById('btnLogout').onclick = (e) => {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'login.html';
        };
    </script>
</body>
</html>
