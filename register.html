<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - MMC 24H</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }
        .register-card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px -10px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 450px; 
        }
        .logo-area { 
            text-align: center; 
            margin-bottom: 2rem; 
        }
        .logo-area h1 {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .form-group { margin-bottom: 1.2rem; }
        label { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 700; 
            margin-bottom: 0.5rem; 
            color: #475569; 
        }
        input, select { 
            width: 100%; 
            padding: 0.8rem 1rem; 
            border: 1.5px solid var(--border); 
            border-radius: 12px; 
            outline: none; 
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        
        .otp-box { display: flex; gap: 10px; }
        .btn-otp { 
            white-space: nowrap; 
            padding: 0 15px; 
            background: white; 
            color: var(--primary); 
            border: 1.5px solid var(--primary); 
            border-radius: 12px; 
            font-weight: 700; 
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-otp:disabled { opacity: 0.5; cursor: not-allowed; border-color: #cbd5e1; color: #64748b; }

        .btn-register { 
            width: 100%; 
            padding: 1rem; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 1rem;
            cursor: pointer; 
            margin-top: 1rem;
            transition: 0.3s;
        }
        .btn-register:hover { background: var(--primary-hover); transform: translateY(-1px); }
        
        #msg { 
            text-align: center; 
            margin-top: 1rem; 
            font-size: 0.85rem; 
            min-height: 20px;
            font-weight: 500;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="logo-area">
            <h1><i class="fas fa-water"></i> MMC 24H</h1>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="name" placeholder="Ví dụ: Nguyễn Công Tuấn" required>
            </div>

            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="tel" id="phone" placeholder="09xxxxxxxx" required>
            </div>

            <div class="form-group">
                <label>Email (Chỉ chấp nhận Gmail)</label>
                <div class="otp-box">
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                    <button type="button" id="btnOtp" class="btn-otp">Gửi mã</button>
                </div>
            </div>

            <div class="form-group">
                <label>Mã xác thực OTP</label>
                <input type="text" id="otp" placeholder="6 chữ số từ email" required maxlength="6">
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label>Vai trò tham gia</label>
                <select id="role">
                    <option value="khach_hang">Khách hàng (Người đi giặt)</option>
                    <option value="chu_nha">Chủ nhà (Cung cấp máy giặt)</option>
                </select>
            </div>

            <button type="submit" class="btn-register">Đăng ký tài khoản</button>
            <div id="msg"></div>
        </form>

        <p style="text-align: center; font-size: 0.85rem; color: #64748b; margin-top: 1.5rem;">
            Đã có tài khoản? <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Đăng nhập</a>
        </p>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api/auth";

        const btnOtp = document.getElementById('btnOtp');
        const msg = document.getElementById('msg');

        // Logic gửi mã OTP
        btnOtp.onclick = async () => {
            const email = document.getElementById('email').value;
            if(!email.includes('@gmail.com')) {
                alert("Vui lòng nhập đúng địa chỉ Gmail.");
                return;
            }

            try {
                btnOtp.disabled = true;
                btnOtp.innerText = "Đang gửi...";
                
                const res = await fetch(`${API_URL}/send-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await res.json();
                if(data.success) {
                    alert("Mã OTP đã được gửi! Vui lòng kiểm tra Gmail.");
                    let countdown = 60;
                    const timer = setInterval(() => {
                        btnOtp.innerText = `Gửi lại (${countdown--}s)`;
                        if(countdown < 0) {
                            clearInterval(timer);
                            btnOtp.disabled = false;
                            btnOtp.innerText = "Gửi mã";
                        }
                    }, 1000);
                } else {
                    alert(data.message);
                    btnOtp.disabled = false;
                    btnOtp.innerText = "Gửi mã";
                }
            } catch (e) {
                alert("Lỗi kết nối Server.");
                btnOtp.disabled = false;
                btnOtp.innerText = "Gửi mã";
            }
        };

        // Logic Đăng ký
        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            msg.innerText = "Đang xử lý...";
            msg.className = "";

            const payload = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                otp: document.getElementById('otp').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                msg.innerText = data.message;
                
                if(data.success) {
                    msg.className = "success";
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    msg.className = "error";
                }
            } catch (err) {
                msg.innerText = "Không thể kết nối tới server backend.";
                msg.className = "error";
            }
        };
    </script>
</body>
</html>
